<style>
  :root {
    --background: #09090b; --foreground: #fafafa;
    --card: #09090b; --card-foreground: #fafafa;
    --primary: #fafafa; --primary-foreground: #18181b;
    --secondary: #27272a; --secondary-foreground: #fafafa;
    --muted: #27272a; --muted-foreground: #a1a1aa;
    --accent: #27272a; --accent-foreground: #fafafa;
    --destructive: #ef4444;
    --border: #27272a; --input: #27272a; --ring: #d4d4d8;
    --radius: 0.5rem; --success: #22c55e;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --background: #ffffff; --foreground: #09090b;
      --card: #ffffff; --card-foreground: #09090b;
      --primary: #18181b; --primary-foreground: #fafafa;
      --secondary: #f4f4f5; --secondary-foreground: #18181b;
      --muted: #f4f4f5; --muted-foreground: #71717a;
      --accent: #f4f4f5; --accent-foreground: #18181b;
      --border: #e4e4e7; --input: #e4e4e7; --ring: #a1a1aa;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%;
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--foreground); background: var(--background); -webkit-font-smoothing: antialiased; }

  .topbar { display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px; border-bottom: 1px solid var(--border);
    background: var(--background); position: sticky; top: 0; z-index: 10; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-logo { width: 30px; height: 30px; border-radius: var(--radius);
    background: var(--foreground); color: var(--background);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; }
  .brand-name { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  .brand-sub { font-size: 11px; color: var(--muted-foreground); font-weight: 500; margin-top: 1px; }
  .topbar-right { display: flex; align-items: center; gap: 8px; }
  .status-chip { display: flex; align-items: center; gap: 6px; padding: 5px 10px;
    background: var(--secondary); border: 1px solid var(--border); border-radius: 9999px;
    font-size: 12px; font-weight: 500; }
  .status-chip.ok { color: var(--success); }
  .status-chip.warn { color: #eab308; }
  .status-chip.err { color: var(--destructive); }
  .status-chip .d { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .nav-link { padding: 6px 12px; border-radius: var(--radius); font-size: 13px; font-weight: 500;
    color: var(--muted-foreground); text-decoration: none; transition: all .15s;
    border: 1px solid transparent; cursor: pointer; background: none; font-family: inherit; }
  .nav-link:hover { background: var(--accent); color: var(--foreground); }

  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }

  .alert { background: var(--secondary); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 16px; font-size: 13px; color: var(--muted-foreground);
    line-height: 1.6; }
  .alert b { color: var(--foreground); }
  .alert code { background: var(--muted); padding: 1px 6px; border-radius: 4px; font-size: 12px;
    border: 1px solid var(--border); color: var(--foreground); }

  .card { background: var(--card); border: 1px solid var(--border);
    border-radius: calc(var(--radius) + 2px); overflow: hidden; }
  .card-header { padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; }
  .card-title { font-size: 14px; font-weight: 600; margin: 0; }
  .card-description { font-size: 12px; color: var(--muted-foreground); margin-top: 2px; }
  .card-content { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }

  .editor { width: 100%; min-height: 220px; max-height: 45vh; overflow-y: auto;
    background: var(--background); border: 1px solid var(--input); border-radius: var(--radius);
    padding: 14px 16px; font-size: 15px; line-height: 1.7; font-family: inherit;
    color: var(--foreground); outline: none; resize: vertical; white-space: pre-wrap; word-break: break-word;
    transition: border-color .15s, box-shadow .15s; }
  .editor:focus { border-color: var(--ring); box-shadow: 0 0 0 2px var(--ring); }
  .editor:empty::before { content: "手机发送的文字会自动出现在这里"; color: var(--muted-foreground); }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn { padding: 8px 14px; border-radius: var(--radius); cursor: pointer;
    font-size: 13px; font-weight: 500; transition: background .15s, opacity .15s; font-family: inherit;
    display: inline-flex; align-items: center; gap: 5px; border: 1px solid transparent; }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
  .btn-primary:hover { opacity: .9; }
  .btn-primary:disabled { opacity: .5; }
  .btn-secondary { background: var(--secondary); color: var(--secondary-foreground); border-color: var(--border); }
  .btn-secondary:hover { background: var(--accent); }
  .btn-outline { background: var(--background); color: var(--foreground); border-color: var(--border); }
  .btn-outline:hover { background: var(--accent); }
  .btn-ghost { background: none; color: var(--foreground); border-color: transparent; }
  .btn-ghost:hover { background: var(--accent); }
  .btn-done { background: var(--success); color: #fff; border-color: var(--success); }
  .mode-text { font-size: 12px; color: var(--muted-foreground); margin-left: auto; }

  .history-list { max-height: 38vh; overflow-y: auto; }
  .history-list:empty::before { content: "收到的文字会显示在这里"; color: var(--muted-foreground);
    display: block; text-align: center; padding: 36px 20px; font-size: 13px; }
  .h-item { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; gap: 14px;
    align-items: flex-start; transition: background .15s; }
  .h-item:last-child { border-bottom: none; }
  .h-item.latest { background: var(--accent); }
  .h-item:hover { background: var(--accent); }
  .h-body { flex: 1; min-width: 0; }
  .h-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
  .h-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px;
    padding: 1px 8px; border-radius: 9999px; background: var(--secondary);
    color: var(--secondary-foreground); font-weight: 500; border: 1px solid var(--border); }
  .h-badge.no-app { background: var(--muted); color: var(--muted-foreground); }
  .h-time { font-size: 11px; color: var(--muted-foreground); }
  .h-from { font-size: 11px; color: var(--muted-foreground); }
  .h-text { font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .h-actions { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
  .mini-btn { padding: 4px 9px; border-radius: calc(var(--radius) - 1px); border: 1px solid var(--border);
    background: var(--background); color: var(--muted-foreground); cursor: pointer;
    font-size: 11px; font-family: inherit; transition: all .1s; }
  .mini-btn:hover { color: var(--foreground); border-color: var(--ring); }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: var(--foreground); color: var(--background); padding: 10px 16px; border-radius: var(--radius);
    font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none;
    transition: all .2s ease; z-index: 99; max-width: 90vw; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.success { background: var(--success); color: #fff; }
  .toast.error { background: var(--destructive); color: #fff; }

  .flash { animation: flash .6s ease; }
  @keyframes flash { 0% { background: var(--accent); } 100% { background: var(--background); } }

  /* Help Modal */
  .help-modal { position: fixed; inset: 0; z-index: 200; display: none; align-items: center; justify-content: center; }
  .help-modal.show { display: flex; }
  .help-modal-mask { position: absolute; inset: 0; background: rgba(0,0,0,.5); backdrop-filter: blur(2px); }
  .help-modal-body { position: relative; background: var(--background); border: 1px solid var(--border);
    border-radius: calc(var(--radius) + 4px); width: 92%; max-width: 640px; max-height: 85vh; display: flex;
    flex-direction: column; box-shadow: 0 16px 48px rgba(0,0,0,.2); animation: helpIn .2s ease; }
  @keyframes helpIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .help-modal-header { display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--background);
    border-radius: calc(var(--radius) + 4px) calc(var(--radius) + 4px) 0 0; z-index: 1; }
  .help-modal-title { font-size: 15px; font-weight: 600; }
  .help-modal-close { width: 28px; height: 28px; border-radius: var(--radius); border: none; background: var(--secondary);
    color: var(--secondary-foreground); font-size: 13px; cursor: pointer; font-family: inherit; }
  .help-modal-close:hover { background: var(--accent); }
  .help-modal-content { overflow-y: auto; padding: 20px 24px; line-height: 1.7; font-size: 14px; }
  .help-modal-content h3 { font-size: 14px; font-weight: 600; margin: 20px 0 8px; padding-top: 16px;
    border-top: 1px solid var(--border); }
  .help-modal-content h3:first-child { border-top: none; padding-top: 0; margin-top: 0; }
  .help-modal-content p { margin: 6px 0; color: var(--muted-foreground); }
  .help-modal-content ol, .help-modal-content ul { margin: 6px 0 6px 20px; padding: 0; color: var(--muted-foreground); }
  .help-modal-content li { margin: 4px 0; }
  .help-modal-content b { color: var(--foreground); }
  .help-modal-content code { background: var(--muted); padding: 2px 6px; border-radius: 4px; font-size: 12px;
    border: 1px solid var(--border); color: var(--foreground); }
  .help-modal-content .step { display: flex; gap: 10px; margin: 8px 0; }
  .help-modal-content .step-num { flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
    background: var(--foreground); color: var(--background); font-size: 12px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; }
  .help-modal-content .step-text { flex: 1; color: var(--muted-foreground); }

  /* Footer */
  .footer { max-width: 1000px; margin: 0 auto; padding: 24px 24px 40px; text-align: center;
    font-size: 12px; color: var(--muted-foreground); line-height: 1.7; }
  .footer a { color: var(--muted-foreground); text-decoration: none; border-bottom: 1px solid var(--border);
    transition: color .15s, border-color .15s; }
  .footer a:hover { color: var(--foreground); border-color: var(--ring); }
  .footer .sep { margin: 0 6px; opacity: .6; }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div class="brand-logo">S</div>

</div>

<div class="wrap">
  <div class="alert" data-i18n="desk.usage">
    <b>使用方式</b>：手机浏览器打开 <code>https://<span id="ip">电脑IP</span>:8443</code> → 用输入法写内容 → 点「发送」→ 文字出现在下面。收到后可直接 <b>⌘V</b> 粘贴，或在「<a href="/settings" style="color:var(--foreground);text-decoration:underline">设置</a>」开启自动粘贴。
  </div>

  <div class="card">
    <div class="card-header">
      <div>
        <div class="card-title" data-i18n="desk.currentContent">当前内容</div>
        <div class="card-description" id="count">0 字</div>
      </div>
    </div>
    <div class="card-content">
      <textarea class="editor" id="box" data-i18n-ph="desk.placeholder" placeholder="手机发送的文字会自动出现在这里"></textarea>
      <div class="actions">
        <button class="btn btn-primary" id="copyBtn" disabled data-i18n="desk.copyAll">复制全部</button>
        <button class="btn btn-outline" id="pasteNowBtn" data-i18n="desk.pasteNow">立即粘贴 (⌘V)</button>
        <button class="btn btn-ghost" id="clearBtn" data-i18n="desk.clear">清空</button>
        <span class="mode-text" id="modeIndicator">追加模式 · 自动粘贴：关</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <div>
        <div class="card-title" data-i18n="desk.history">历史记录</div>
        <div class="card-description" data-i18n="desk.historyDesc">持久化保存 · 刷新不丢失</div>
      </div>
      <button class="btn btn-ghost" id="clearHistoryBtn" style="color:var(--destructive)" data-i18n="desk.clearHistory">清空历史</button>
    </div>
    <div class="history-list" id="history"></div>
  </div>
</div>

<footer class="footer">
  <span data-i18n="footer.madeBy">Crafted by</span>
  <a href="https://github.com/joyapple" target="_blank" rel="noopener">JOYAPPLE</a>
  <span class="sep">·</span>
  <a href="https://github.com/joyapple/SayIn" target="_blank" rel="noopener">GitHub</a>
  <span class="sep">·</span>
  <span>Apache-2.0</span>
</footer>

<div class="toast" id="toast"></div>

<div class="help-modal" id="helpModal">
  <div class="help-modal-mask" id="helpMask"></div>
  <div class="help-modal-body">
    <div class="help-modal-header">
      <div class="help-modal-title" data-i18n="help.title">使用帮助</div>
      <button class="help-modal-close" id="helpClose">✕</button>
    </div>
    <div class="help-modal-content" id="helpContent"></div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const box = $('box'), countEl = $('count'), copyBtn = $('copyBtn'), clearBtn = $('clearBtn');
  const pasteNowBtn = $('pasteNowBtn');
  const statusChip = $('statusChip'), statusText = $('statusText');
  const history = $('history'), clearHistoryBtn = $('clearHistoryBtn');
  const modeIndicator = $('modeIndicator');
  let ws = null, records = [], settings = { autoPaste: false, appendMode: true, enterAfterPaste: false, language: 'zh' };
  let lang = 'zh';

  // === i18n ===
  const I18N = {
    zh: {
      'desk.receiver': '接收窗口', 'nav.settings': '设置', 'nav.help': '帮助',
      'status.connecting': '连接中…', 'status.connected': '已连接 · 等待手机发送',
      'status.failed': '无法连接', 'status.disconnected': '已断开，重连中…',
      'desk.usage': '<b>使用方式</b>：手机浏览器打开 <code>https://<span id="ip">电脑IP</span>:8443</code> → 用输入法写内容 → 点「发送」→ 文字出现在下面。收到后可直接 <b>⌘V</b> 粘贴，或在「<a href="/settings" style="color:var(--foreground);text-decoration:underline">设置</a>」开启自动粘贴。',
      'desk.currentContent': '当前内容', 'desk.placeholder': '手机发送的文字会自动出现在这里',
      'desk.copyAll': '复制全部', 'desk.pasteNow': '立即粘贴 (⌘V)', 'desk.clear': '清空',
      'desk.history': '历史记录', 'desk.historyDesc': '持久化保存 · 刷新不丢失', 'desk.clearHistory': '清空历史',
      'desk.emptyHistory': '收到的文字会显示在这里',
      'mode.append': '追加模式', 'mode.overwrite': '覆盖模式',
      'mode.autoPasteOn': '自动粘贴：开', 'mode.autoPasteOff': '自动粘贴：关',

      'toast.pasteFailed': '粘贴失败，请检查辅助功能权限', 'toast.pasteFailedShort': '粘贴失败',
      'toast.autoPastedEnter': '已自动粘贴并回车', 'toast.autoPasted': '已自动粘贴到光标',

      'toast.received': (n, s) => `收到 ${n} 字${s ? ' → ' + s : ''}`,
      'toast.historyEmpty': '历史已为空', 'toast.historyCleared': '历史已清空',
      'toast.loaded': '已填入编辑框',
      'confirm.clearContent': '清空当前内容？', 'confirm.clearHistory': '确定清空所有历史记录？此操作不可恢复。',

      'help.content': `
<h3>快速开始</h3>
<div class="step"><div class="step-num">1</div><div class="step-text">电脑端打开 <code>http://localhost:8000/desk</code> 接收窗口</div></div>
<div class="step"><div class="step-num">2</div><div class="step-text">手机浏览器打开 <code>https://电脑IP:8443</code>（推荐 HTTPS）</div></div>
<div class="step"><div class="step-num">3</div><div class="step-text">用手机输入法打字或语音输入，点「发送」</div></div>
<div class="step"><div class="step-num">4</div><div class="step-text">文字自动出现在电脑接收窗口，可手动 ⌘V 粘贴或开启自动粘贴</div></div>

<h3>PWA 安装（全屏使用）</h3>
<p>通过 <b>HTTPS（8443 端口）</b>访问可添加到手机主屏幕，像 App 一样全屏运行：</p>
<ul>
<li><b>Android</b>：Chrome 打开 <code>https://电脑IP:8443</code> → 页面顶部点「安装」</li>
<li><b>iOS</b>：Safari 打开 <code>https://电脑IP:8443</code> → 底部「分享」→「添加到主屏幕」</li>
</ul>
<p>注意：通过 HTTP（8000 端口）添加会保留地址栏，必须用 HTTPS。</p>

<h3>macOS 辅助功能权限（自动粘贴需要）</h3>
<p>开启「自动粘贴到光标」后，需要授权辅助功能权限，电脑才能模拟 ⌘V 粘贴：</p>
<ol>
<li>打开 <b>系统设置</b> → <b>隐私与安全性</b> → <b>辅助功能</b></li>
<li>点击「+」添加运行 SayIn 的终端应用（如「终端」「iTerm」）</li>
<li>确保该应用旁边的开关已打开</li>
</ol>
<p>如果已经添加过但仍无法粘贴，尝试先移除再重新添加。</p>

<h3>macOS 自动化权限（应用切换需要）</h3>
<p>切换软件功能可能需要授权自动化权限：</p>
<ol>
<li>打开 <b>系统设置</b> → <b>隐私与安全性</b> → <b>自动化</b></li>
<li>找到终端应用，展开后勾选 <b>System Events</b></li>
</ol>

<h3>信任自签证书（HTTPS 访问）</h3>
<p>首次通过 HTTPS 访问时浏览器会提示证书不受信任：</p>
<ul>
<li><b>Android Chrome</b>：点「高级」→「继续前往」</li>
<li><b>iOS Safari</b>：点「显示详细信息」→「访问此网站」</li>
<li><b>macOS</b>：双击 <code>certs/cert.pem</code> 导入钥匙串并设为始终信任</li>
</ul>

<h3>软件白名单</h3>
<p>在「<a href="/settings" style="color:var(--foreground);text-decoration:underline">设置</a>」页面的「可切换软件白名单」卡片中：</p>
<ul>
<li>点「加载运行中应用」从当前打开的软件一键添加</li>
<li>也可手动输入软件名称回车添加</li>
<li>留空则手机端显示所有运行中的应用</li>
<li>软件名称需与系统显示名一致（如 <code>微信</code>、<code>Google Chrome</code>）</li>
</ul>

<h3>常见问题</h3>

`,

      'help.content': `
<h3>Quick Start</h3>
<div class="step"><div class="step-num">1</div><div class="step-text">Open <code>http://localhost:8000/desk</code> on your computer</div></div>
<div class="step"><div class="step-num">2</div><div class="step-text">Open <code>https://computer-IP:8443</code> on your phone (HTTPS recommended)</div></div>
<div class="step"><div class="step-num">3</div><div class="step-text">Type or dictate on your phone, tap "Send"</div></div>
<div class="step"><div class="step-num">4</div><div class="step-text">Text appears on desktop. Press ⌘V to paste, or enable auto-paste</div></div>

<h3>PWA Installation (Full Screen)</h3>
<p>Add to your phone's home screen via <b>HTTPS (port 8443)</b> for full-screen app mode:</p>
<ul>
<li><b>Android</b>: Open <code>https://computer-IP:8443</code> in Chrome → tap "Install"</li>
<li><b>iOS</b>: Open <code>https://computer-IP:8443</code> in Safari → Share → Add to Home Screen</li>
</ul>
<p>Note: HTTP (port 8000) keeps the address bar. HTTPS is required for full screen.</p>

<h3>macOS Accessibility Permission (Auto-paste)</h3>
<p>To use "Auto-paste to cursor", grant Accessibility permission so the app can simulate ⌘V:</p>
<ol>
<li>Open <b>System Settings</b> → <b>Privacy & Security</b> → <b>Accessibility</b></li>
<li>Click "+" to add your terminal app (e.g. "Terminal", "iTerm")</li>
<li>Make sure the toggle next to it is ON</li>
</ol>
<p>If it still doesn't work after adding, try removing and re-adding.</p>

<h3>macOS Automation Permission (App Switching)</h3>
<p>App switching may require Automation permission:</p>
<ol>
<li>Open <b>System Settings</b> → <b>Privacy & Security</b> → <b>Automation</b></li>
<li>Find your terminal app, expand it and check <b>System Events</b></li>
</ol>

<h3>Trust Self-Signed Certificate (HTTPS)</h3>
<p>When accessing via HTTPS for the first time, the browser will warn about the certificate:</p>
<ul>
<li><b>Android Chrome</b>: Tap "Advanced" → "Proceed"</li>
<li><b>iOS Safari</b>: Tap "Show Details" → "Visit Website"</li>
<li><b>macOS</b>: Double-click <code>certs/cert.pem</code> to import into Keychain and set as Always Trust</li>
</ul>

<h3>App Whitelist</h3>
<p>In the "App Switcher Whitelist" card on the <a href="/settings" style="color:var(--foreground);text-decoration:underline">Settings</a> page:</p>
<ul>
<li>Click "Load running apps" to add from currently open apps</li>
<li>Or type app names manually and press Enter</li>
<li>Leave empty to show all running apps on the phone</li>
<li>App names must match system display names (e.g. <code>WeChat</code>, <code>Google Chrome</code>)</li>
</ul>

<h3>FAQ</h3>
<p><b>Phone can't open the page?</b> Ensure phone and computer are on the same WiFi, and firewall allows ports 8000/8443.</p>
<p><b>No text on desktop after sending?</b> Refresh <code>localhost:8000/desk</code> and check it says "Connected".</p>
<p><b>Apps not detected?</b> Click "Load running apps" on the Settings page to refresh. System apps are filtered automatically.</p>
<p><b>PWA has address bar?</b> Must use HTTPS (8443) when adding to home screen.</p>
`,
    },
  };
  function t(key, ...args) {
    const v = (I18N[lang] && I18N[lang][key]) || (I18N.zh[key]) || key;
    return typeof v === 'function' ? v(...args) : v;
  }
  function applyLang() {
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.dataset.i18n;
      const v = t(key);
      if (v.includes('<')) el.innerHTML = v; else el.textContent = v;
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => {
      el.placeholder = t(el.dataset.i18nPh);
    });
    countEl.textContent = t('count.chars', box.value.length);
    updateModeIndicator();
    renderHistory();
    // 帮助弹窗内容
    const hc = $('helpContent'); if (hc) hc.innerHTML = t('help.content');
  }

  function toast(msg, type = '', ms = 2200) {
    const tt = $('toast'); tt.textContent = msg; tt.className = 'toast show ' + type;
    clearTimeout(toast._t); toast._t = setTimeout(() => tt.className = 'toast ' + type, ms);
  }
  function setStatus(state, text) {
    statusChip.className = 'status-chip ' + (state || '');
    statusText.textContent = text;
  }
  function updateModeIndicator() {
    const parts = [];
    parts.push(settings.appendMode ? t('mode.append') : t('mode.overwrite'));
    parts.push(settings.autoPaste ? t('mode.autoPasteOn') : t('mode.autoPasteOff'));
    if (settings.autoPaste) parts.push(settings.enterAfterPaste ? t('mode.enterOn') : t('mode.enterOff'));
    modeIndicator.textContent = parts.join(' · ');
  }

  async function loadSettings() {
    try {
      const r = await fetch('/settings'); const j = await r.json();
      if (j.ok && j.settings) { settings = { ...settings, ...j.settings }; lang = settings.language || 'zh'; applyLang(); }
    } catch {}
  }
  loadSettings();

  async function loadHistory() {
    try {
      const r = await fetch('/history'); const j = await r.json();
      if (j.ok && Array.isArray(j.history)) {
        records = j.history.map(h => ({ text: h.text, t: h.t || new Date(h.ts).toLocaleTimeString('zh-CN', { hour12: false }), from: h.from || t('from.phone'), targetApp: h.targetApp || '' }));
        renderHistory();
      }
    } catch {}
  }
  loadHistory();

  clearHistoryBtn.onclick = async () => {
    if (!records.length) return toast(t('toast.historyEmpty'));
    if (!confirm(t('confirm.clearHistory'))) return;
    try { await fetch('/history', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ clear: true }) }); } catch {}
    records = []; renderHistory(); toast(t('toast.historyCleared'), 'success');
  };

  copyBtn.onclick = async () => {
    const text = box.value; if (!text) return;
    try { await navigator.clipboard.writeText(text); } catch { box.select(); document.execCommand('copy'); }
    copyBtn.classList.add('btn-done'); copyBtn.textContent = t('btn.copied');
    setTimeout(() => { copyBtn.classList.remove('btn-done'); copyBtn.textContent = t('desk.copyAll'); }, 1000);
    toast(t('toast.copiedHint', text.length), 'success', 3000);
  };
  box.addEventListener('input', () => {
    countEl.textContent = t('count.chars', box.value.length);
    copyBtn.disabled = !box.value.trim();
  });
  clearBtn.onclick = () => { if (box.value && confirm(t('confirm.clearContent'))) { box.value = ''; box.dispatchEvent(new Event('input')); } };

  pasteNowBtn.onclick = async () => {
    if (!box.value.trim()) return toast(t('toast.noContent'), 'error');
    try { await navigator.clipboard.writeText(box.value); } catch {}
    try {
      const r = await fetch('/paste', { method: 'POST' }); const j = await r.json();
      if (j.ok) toast(j.enterOk ? t('toast.pastedEnter') : t('toast.pasted'), 'success');
      else toast(t('toast.pasteFailed'), 'error', 3500);
    } catch { toast(t('toast.pasteFailedShort'), 'error'); }
  };

  function tryWS(url, to = 3000) {
    return new Promise((rs, rj) => {
      const s = new WebSocket(url); const tm = setTimeout(() => { try { s.close(); } catch {} rj(new Error('to')); }, to);
      s.onopen = () => { clearTimeout(tm); rs(s); };
      s.onerror = () => { clearTimeout(tm); rj(new Error('err')); };
    });
  }
  async function doConnect() {
    setStatus('warn', t('status.connecting'));
    const host = location.hostname;
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const port = location.port || (location.protocol === 'https:' ? '443' : '80');
    const otherPort = proto === 'wss' ? '8000' : '8443';
    for (const url of [`${proto}://${host}:${port}/desk`, `${proto === 'wss' ? 'ws' : 'wss'}://${host}:${otherPort}/desk`]) {
      try { ws = await tryWS(url); break; } catch {}
    }
    if (!ws) { setStatus('err', t('status.failed')); setTimeout(doConnect, 4000); return; }
    ws.onmessage = (ev) => {
      try {
        const m = JSON.parse(ev.data);
        if (m.type === 'hello') {
          setStatus('ok', t('status.connected'));
          if (m.settings) { settings = { ...settings, ...m.settings }; lang = settings.language || lang; applyLang(); updateModeIndicator(); }
        }
        else if (m.type === 'settings' && m.settings) { settings = { ...settings, ...m.settings }; lang = settings.language || lang; applyLang(); updateModeIndicator(); }
        else if (m.type === 'text' && typeof m.text === 'string') receive(m.text, m.ts, m.from, m.targetApp);
        else if (m.type === 'paste_done') {
          if (m.ok) toast(m.enterOk ? t('toast.autoPastedEnter') : t('toast.autoPasted'), 'success');
          else toast(t('toast.autoPasteFailed'), 'error', 3500);
        }
      } catch {}
    };
    ws.onclose = () => { setStatus('', t('status.disconnected')); setTimeout(doConnect, 3000); };
    ws.onerror = () => {};
  }

  function receive(text, ts, from, targetApp) {
    if (settings.appendMode && box.value.trim()) {
      box.value = box.value.trimEnd() + '\n' + text;
    } else {
      box.value = text;
    }
    box.dispatchEvent(new Event('input'));
    box.classList.remove('flash'); void box.offsetWidth; box.classList.add('flash');
    navigator.clipboard?.writeText(box.value).catch(() => {
      try { box.select(); document.execCommand('copy'); box.setSelectionRange(box.value.length, box.value.length); } catch {}
    });
    const tm = new Date(ts || Date.now()).toLocaleTimeString('zh-CN', { hour12: false });
    records.unshift({ text, t: tm, from: from || t('from.phone'), targetApp: targetApp || '' });
    if (records.length > 100) records.pop();
    renderHistory();
    toast(t('toast.received', text.length, targetApp), 'success');
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) {
        const c = new Ctx(); const o = c.createOscillator(); const g = c.createGain();
        o.type = 'sine'; o.frequency.value = 1180;
        o.connect(g); g.connect(c.destination);
        g.gain.setValueAtTime(0.0001, c.currentTime);
        g.gain.exponentialRampToValueAtTime(0.1, c.currentTime + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.12);
        o.start(); o.stop(c.currentTime + 0.14);
        setTimeout(() => c.close(), 300);
      }
    } catch {}
  }

  function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function renderHistory() {
    if (!records.length) {
      history.innerHTML = `<div style="text-align:center;padding:36px 20px;color:var(--muted-foreground);font-size:13px">${t('desk.emptyHistory')}</div>`;
      return;
    }
    history.innerHTML = records.map((r, i) => `
      <div class="h-item ${i === 0 ? 'latest' : ''}">
        <div class="h-body">
          <div class="h-top">
            <span class="h-badge ${r.targetApp ? '' : 'no-app'}">${r.targetApp ? esc(r.targetApp) : t('badge.receiver')}</span>
            <span class="h-time">${r.t}</span>
            <span class="h-from">${r.from} · ${r.text.length}${lang === 'zh' ? '字' : ''}</span>
          </div>
          <div class="h-text">${esc(r.text)}</div>
        </div>
        <div class="h-actions">
          <button class="mini-btn" data-act="copy" data-i="${i}">${t('action.copy')}</button>
          <button class="mini-btn" data-act="load" data-i="${i}">${t('action.load')}</button>
        </div>
      </div>
    `).join('');
  }
  history.addEventListener('click', async (e) => {
    const b = e.target.closest('.mini-btn'); if (!b) return;
    const i = +b.dataset.i; const r = records[i]; if (!r) return;
    if (b.dataset.act === 'copy') {
      try { await navigator.clipboard.writeText(r.text); } catch {}
      toast(t('toast.copied'), 'success');
    } else if (b.dataset.act === 'load') {
      box.value = r.text; box.dispatchEvent(new Event('input')); box.focus();
      toast(t('toast.loaded'));
    }
  });

  fetch('/ip').then(r => r.text()).then(txt => {
    const ip = location.hostname !== 'localhost' ? location.hostname : txt.trim();
    if (ip) $('ip').textContent = ip;
  }).catch(() => {});

  // 帮助弹窗
  $('helpBtn').onclick = () => $('helpModal').classList.add('show');
  $('helpClose').onclick = () => $('helpModal').classList.remove('show');
  $('helpMask').onclick = () => $('helpModal').classList.remove('show');
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('helpModal').classList.remove('show'); });

  doConnect();
})();
</script>
